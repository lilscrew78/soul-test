<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵魂档案 - 密钥管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e8dcc4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{max-width:420px;width:100%;background:rgba(255,255,255,0.05);border:1px solid #c9a96e;border-radius:16px;padding:40px 30px}
h1{text-align:center;font-size:20px;color:#c9a96e;margin-bottom:8px;letter-spacing:2px}
.subtitle{text-align:center;font-size:13px;color:#888;margin-bottom:30px}
.input-group{margin-bottom:20px}
.input-group label{display:block;font-size:13px;color:#c9a96e;margin-bottom:8px}
.input-group input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.08);border:1px solid #333;border-radius:8px;color:#e8dcc4;font-size:15px;outline:none;transition:border-color 0.3s}
.input-group input:focus{border-color:#c9a96e}
.btn{width:100%;padding:14px;background:#c9a96e;border:none;border-radius:8px;color:#1a1a2e;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.3s}
.btn:hover{opacity:0.85}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid #c9a96e;color:#c9a96e;margin-top:10px}
.current-key{background:rgba(201,169,110,0.1);border:1px solid #c9a96e;border-radius:8px;padding:16px;text-align:center;margin:20px 0}
.current-key .label{font-size:12px;color:#888;margin-bottom:6px}
.current-key .value{font-size:28px;color:#c9a96e;font-weight:600;letter-spacing:2px}
.msg{text-align:center;font-size:13px;margin-top:12px;min-height:20px}
.msg.success{color:#4CAF50}
.msg.error{color:#f44336}
.key-list{margin-top:20px;padding:12px;background:rgba(255,255,255,0.05);border-radius:8px;max-height:200px;overflow-y:auto}
.key-list .item{font-size:13px;color:#e8dcc4;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:color 0.3s}
.key-list .item:hover{color:#c9a96e}
.key-list .item:last-child{border-bottom:none}
.tip{font-size:12px;color:#666;margin-top:16px;line-height:1.6}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>SOUL ARCHIVE</h1>
<p class="subtitle">密钥管理后台</p>

<div class="input-group">
<label>GitHub Token（每次使用需输入，不存储）</label>
<input type="password" id="githubToken" placeholder="ghp_开头的token" value="">
</div>

<button class="btn" id="loadBtn" onclick="loadDailyKey()">查看当前每日密钥</button>

<div class="current-key hidden" id="currentKeyBox">
<div class="label">当前每日密钥（所有用户共用）</div>
<div class="value" id="currentKeyValue">—</div>
</div>

<div class="input-group" style="margin-top:20px">
<label>设置新密钥（从下方列表点击选择，或手动输入）</label>
<input type="text" id="newKey" placeholder="如 2601" maxlength="4">
</div>

<button class="btn" id="setBtn" onclick="setDailyKey()">设为每日密钥</button>
<button class="btn btn-outline" onclick="clearDailyKey()">清除每日密钥</button>

<div class="msg" id="msg"></div>

<div class="key-list hidden" id="keyListBox">
<div style="font-size:12px;color:#888;margin-bottom:8px">点击密钥直接填入上方输入框</div>
<div id="keyList"></div>
</div>

<button class="btn btn-outline" style="margin-top:20px" onclick="toggleKeyList()">显示/隐藏密钥列表</button>

<div class="tip">
<b>使用说明：</b><br>
1. 从密钥列表选一个，点击"设为每日密钥"<br>
2. 把这个密钥写进小红书自动发货话术里<br>
3. 当天所有买家共用这个密钥，可多次使用<br>
4. 第二天换一个新密钥，更新话术即可<br>
5. 之前的每日密钥自动失效<br><br>
<b>注意：</b>GitHub Token在ghp_开头，每次使用需要重新输入，不会保存在任何地方。设置新密钥后会自动清除CDN缓存，立即生效。
</div>
</div>

<script>
var REPO="lilscrew78/soul-test";
var FILE_PATH="daily-key.txt";
var KEYS=["2601","9473","9463","7564","6899","8202","2863","4550","7256","6098","5659","8642","9158","6055","8403","8825","5845","9572","8898","6481","8301","5373","2655","2627","9058","2549","6738","7913","5683","6740","1286","6713","8580","1415","5539","3000","3090","8798","6061","4962","3530","9939","2958","7660","4594","8481","5788","9698","5319","1885","4021","6634","7688","1355","8492","2731","6912","1287","1386","1496","4566","4830","3589","6136","3737","7908","1160","8063","9630","2631","2144","3434","7132","3690","2133","4926","8656","6308","9285","3449","9240","1097","7239","6390","4441","3851","7873","1519","7273","8504","1919","4720","2636","1486","2790","8160","8064","2495","9562","6643"];

function showMsg(text,type){var el=document.getElementById("msg");el.textContent=text;el.className="msg "+type}
function getToken(){return document.getElementById("githubToken").value.trim()}

async function getSha(){
var res=await fetch("https://api.github.com/repos/"+REPO+"/contents/"+FILE_PATH,{headers:{Authorization:"token "+getToken(),Accept:"application/vnd.github.v3+json"}});
var data=await res.json();
return data.sha;
}

function loadDailyKey(){
var btn=document.getElementById("loadBtn");
btn.disabled=true;btn.textContent="加载中...";
var url="daily-key.txt?t="+Date.now();
fetch(url)
.then(function(r){return r.text()})
.then(function(text){
btn.disabled=false;btn.textContent="查看当前每日密钥";
text=text.trim();
var box=document.getElementById("currentKeyBox");
var val=document.getElementById("currentKeyValue");
box.classList.remove("hidden");
if(text==="NONE"||!text){val.textContent="未设置";}else{val.textContent=text;}
showMsg("加载成功","success");
})
.catch(function(){
fetch("https://cdn.jsdelivr.net/gh/"+REPO+"@main/"+FILE_PATH+"?t="+Date.now())
.then(function(r){return r.text()})
.then(function(text){
btn.disabled=false;btn.textContent="查看当前每日密钥";
text=text.trim();
var box=document.getElementById("currentKeyBox");
var val=document.getElementById("currentKeyValue");
box.classList.remove("hidden");
if(text==="NONE"||!text){val.textContent="未设置";}else{val.textContent=text;}
showMsg("加载成功（CDN）","success");
})
.catch(function(e){
btn.disabled=false;btn.textContent="查看当前每日密钥";
showMsg("网络错误，请重试","error");
});
});
}

async function setDailyKey(){
var token=getToken();
if(!token){showMsg("请输入GitHub Token","error");return}
var nk=document.getElementById("newKey").value.trim();
if(!nk){showMsg("请输入或选择一个密钥","error");return}
var btn=document.getElementById("setBtn");
btn.disabled=true;btn.textContent="设置中...";
try{
var sha=await getSha();
var body={message:"Update daily key",content:btoa(nk),sha:sha,branch:"main"};
var res=await fetch("https://api.github.com/repos/"+REPO+"/contents/"+FILE_PATH,{method:"PUT",headers:{Authorization:"token "+token,Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},body:JSON.stringify(body)});
var data=await res.json();
if(data.content){
await purgeCDN();
btn.disabled=false;btn.textContent="设为每日密钥";
document.getElementById("currentKeyBox").classList.remove("hidden");
document.getElementById("currentKeyValue").textContent=nk;
showMsg("设置成功！密钥已立即生效","success");
}else{
btn.disabled=false;btn.textContent="设为每日密钥";
showMsg(data.message||"设置失败","error");
}
}catch(e){
btn.disabled=false;btn.textContent="设为每日密钥";
showMsg("网络错误，请检查Token是否正确","error");
}
}

async function clearDailyKey(){
var token=getToken();
if(!token){showMsg("请输入GitHub Token","error");return}
try{
var sha=await getSha();
var body={message:"Clear daily key",content:btoa("NONE"),sha:sha,branch:"main"};
var res=await fetch("https://api.github.com/repos/"+REPO+"/contents/"+FILE_PATH,{method:"PUT",headers:{Authorization:"token "+token,Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},body:JSON.stringify(body)});
var data=await res.json();
if(data.content){
await purgeCDN();
document.getElementById("currentKeyValue").textContent="未设置";
showMsg("已清除","success");
}else{showMsg(data.message||"清除失败","error");}
}catch(e){showMsg("网络错误，请检查Token","error");}
}

async function purgeCDN(){
try{
await fetch("https://purge.jsdelivr.net/gh/"+REPO+"@main/"+FILE_PATH);
}catch(e){}
}

function toggleKeyList(){
var box=document.getElementById("keyListBox");
if(box.classList.contains("hidden")){
box.classList.remove("hidden");
var html="";
for(var i=0;i<KEYS.length;i++){
html+='<div class="item" onclick="selectKey(\''+KEYS[i]+'\')">'+(i+1)+'. '+KEYS[i]+'</div>';
}
document.getElementById("keyList").innerHTML=html;
}else{box.classList.add("hidden");}
}

function selectKey(k){
document.getElementById("newKey").value=k;
document.getElementById("newKey").focus();
}
</script>
</body>
</html>
